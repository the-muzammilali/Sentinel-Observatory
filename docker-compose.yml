version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    # Remove port mapping - Coolify handles this via reverse proxy
    expose:
      - "8000"
    environment:
      # Authentication (override in production)
      - AUTH_USERNAME=${AUTH_USERNAME:-sentinel}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-observatory2024}
      
      # API Keys (REQUIRED - set in .env file)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_API_KEYS=${GOOGLE_API_KEYS}
      
      # CORS (set to your frontend domain in production)
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      
      # Model configuration
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.0-flash}
      
      # Simulation configuration
      - USE_SCOPESIM=${USE_SCOPESIM:-true}
      - SIMULATION_SPEED=${SIMULATION_SPEED:-2}
      - IMAGE_SIZE=${IMAGE_SIZE:-1024}
      - FIELD_OF_VIEW=${FIELD_OF_VIEW:-60}
      - NUM_STATIC_STARS=${NUM_STATIC_STARS:-500}
    volumes:
      # Persist data and logs
      - ./data:/app/data
      - ./logs:/app/logs
      # Mount instrument packages (read-only)
      - ./inst_pkgs:/app/inst_pkgs:ro
    networks:
      - sentinel-network
      - coolify
    labels:
      # Traefik labels for Coolify routing
      - "traefik.enable=true"
      - "traefik.http.routers.sentinel-backend.rule=Host(`api.sentinel.itpyx.pk`)"
      - "traefik.http.routers.sentinel-backend.entrypoints=websecure"
      - "traefik.http.routers.sentinel-backend.tls=true"
      - "traefik.http.routers.sentinel-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.sentinel-backend.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    # Remove port mapping - Coolify handles this via reverse proxy
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - sentinel-network
      - coolify
    labels:
      # Traefik labels for Coolify routing
      - "traefik.enable=true"
      - "traefik.http.routers.sentinel-frontend.rule=Host(`sentinel.itpyx.pk`)"
      - "traefik.http.routers.sentinel-frontend.entrypoints=websecure"
      - "traefik.http.routers.sentinel-frontend.tls=true"
      - "traefik.http.routers.sentinel-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.sentinel-frontend.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  sentinel-network:
    driver: bridge
  # Connect to Coolify's proxy network
  coolify:
    external: true
    name: coolify

volumes:
  data:
  logs:
