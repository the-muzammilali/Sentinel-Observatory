version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Authentication (override in production)
      - AUTH_USERNAME=${AUTH_USERNAME:-sentinel}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-observatory2024}
      
      # API Keys (REQUIRED - set in .env file)
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_API_KEYS=${GOOGLE_API_KEYS}
      
      # CORS (set to your frontend domain in production)
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      
      # Model configuration
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.0-flash}
    volumes:
      # Persist data and logs
      - ./data:/app/data
      - ./logs:/app/logs
      # Mount instrument packages (read-only)
      - ./inst_pkgs:/app/inst_pkgs:ro
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sentinel-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

networks:
  sentinel-network:
    driver: bridge

volumes:
  data:
  logs:
